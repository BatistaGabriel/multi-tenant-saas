# Neon: DATABASE_URL must be a full JDBC URL with sslmode=require, e.g.:
#   jdbc:postgresql://ep-xxx.us-east-2.aws.neon.tech/dbname?sslmode=require
# Render: PORT is injected automatically. JWT keys should be stored as Render secret files
#   mounted at a known path, referenced by JWT_PRIVATE_KEY_PATH / JWT_PUBLIC_KEY_PATH.

spring:
  datasource:
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:5}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 60000

  jpa:
    show-sql: false
    open-in-view: false

springdoc:
  swagger-ui:
    enabled: false
